[project]
name = "bus-lot-optimization-gpu"
version = "0.1.0"
description = "Experimento adicional GPU isolado para ACO e PSO"
requires-python = ">=3.14,<3.15"
dependencies = [
  "bus-lot-optimization",
  "cupy-cuda12x[ctk]>=14,<15",
]

[dependency-groups]
dev = ["pytest>=9,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metaheuristica_gpu"]

[tool.uv.sources]
bus-lot-optimization = { path = "..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
